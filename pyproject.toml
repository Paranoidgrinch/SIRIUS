[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sirius"
version = "0.1.0"
description = "Physics-informed automated ion-beam optimization for FLAVIA"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]